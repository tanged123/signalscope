[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # hdf5-metno-sys uses libloading for the system HDF5 library.
  "ISC",
  # Arrow's ahash dependency uses tiny-keccak under its CC0 license.
  "CC0-1.0",
  # The Windows static HDF5 source bundle includes HDF5's upstream license.
  "HDF5",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
