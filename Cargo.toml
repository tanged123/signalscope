[workspace]
resolver = "2"
members = [
  "core/scope-compute",
  "core/scope-ingest",
  "core/scope-pyramid",
  "core/scope-session",
  "core/scope-store",
  "protocol",
  "shell/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tanged123/signalscope"
rust-version = "1.82"

[workspace.dependencies]
csv = "1.3"
memmap2 = "0.9"
scope-compute = { path = "core/scope-compute" }
scope-ingest = { path = "core/scope-ingest" }
scope-protocol = { path = "protocol" }
scope-pyramid = { path = "core/scope-pyramid" }
scope-session = { path = "core/scope-session" }
scope-store = { path = "core/scope-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
