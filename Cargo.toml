[workspace]
resolver = "2"
members = ["core/scope-core", "protocol", "shell/src-tauri"]

[workspace.package]
version = "0.19.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/tanged123/signalscope"
rust-version = "1.85"

[workspace.dependencies]
arrow-cast = "56"
crc32fast = "1.5"
csv = "1.3"
hdf5-metno = "0.10"
arrow-array = "56"
arrow-schema = "56"
mcap = "0.25"
parquet = { version = "56", default-features = false, features = [
  "arrow",
  "snap",
  "brotli",
  "flate2-rust_backened",
  "lz4",
  "zstd",
] }
toml = "0.9"
scope-core = { path = "core/scope-core", version = "0.19.1" }
scope-protocol = { path = "protocol", version = "0.19.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
