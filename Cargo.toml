[workspace]
resolver = "2"
members = ["core/scope-core", "protocol", "shell/src-tauri"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tanged123/signalscope"
rust-version = "1.85"

[workspace.dependencies]
crc32fast = "1.5"
csv = "1.3"
mcap = "0.25"
scope-core = { path = "core/scope-core", version = "0.12.0" }
scope-protocol = { path = "protocol", version = "0.12.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
