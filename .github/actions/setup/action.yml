name: SignalScope environment
description: Install Nix, connect the Cachix cache, and prepare the workspace.

inputs:
  cachix-auth-token:
    description: >-
      Cachix auth token. When empty (for example on fork pull requests), the
      cache is used read-only and pushes are skipped.
    default: ""
  install-frontend:
    description: Run ./scripts/setup.sh to install locked frontend dependencies.
    default: "true"
  cargo-cache-key:
    description: >-
      Job-specific key enabling Cargo registry and target-directory caching.
      Empty disables the cache.
    default: ""

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: tanged123
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-auth-token == '' }}
    - if: inputs.cargo-cache-key != ''
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ inputs.cargo-cache-key }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
        restore-keys: |
          cargo-${{ inputs.cargo-cache-key }}-${{ runner.os }}-
    - if: inputs.install-frontend == 'true'
      run: ./scripts/setup.sh
      shell: bash
