name: Format Check

on: push

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: tanged123
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: ./scripts/ci.sh format
