name: SignalScope CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_demo:
        description: Generate demo artifacts without publishing them
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/version.sh check
      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/version.sh check-pr "$BASE_SHA"

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-frontend: "false"
      - run: ./scripts/ci.sh flake

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: ./scripts/ci.sh quality

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache-key: rust
      - run: ./scripts/ci.sh rust

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: ./scripts/ci.sh frontend
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-template
          path: frontend/dist/snapshot-template.html

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache-key: e2e
      - run: ./scripts/ci.sh e2e

  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: ./scripts/coverage.sh
      - if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./build/coverage/rust.lcov,./build/coverage/frontend/lcov.info
          version: v11.2.7
          fail_ci_if_error: true

  ci-ok:
    if: always()
    needs: [version, flake, quality, rust, frontend, e2e, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./scripts/check-ci-results.sh

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: windows
            arch: x64
          - os: macos-26-intel
            platform: mac
            arch: x64
          - os: macos-26
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: matrix.platform != 'windows'
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache-key: build
      - if: matrix.platform != 'windows'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/ci.sh build
      - if: matrix.platform == 'windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/build-windows.sh
        shell: bash
      - env:
          SIGNALSCOPE_EXPECT_WEBGPU: ${{ matrix.platform == 'windows' && '0' || '1' }}
          SIGNALSCOPE_WINDOWS_BUILD: ${{ matrix.platform == 'windows' && '1' || '' }}
        run: ./scripts/test.sh desktop package
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/packages/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  release-gate:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - id: version
        run: printf 'version=%s\n' "$(./scripts/version.sh get)" >> "$GITHUB_OUTPUT"
      - env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh checksums "v$RELEASE_VERSION" release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ github.sha }}
          path: release-assets
          if-no-files-found: error

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, flake, quality, rust, frontend, e2e, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      # The release job needs the checkout credential to push its tag.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - id: release-tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(./scripts/release.sh tag)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  demo:
    if: >-
      always() &&
      (needs.tag.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_demo))
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: ./scripts/demo.sh all
      - uses: actions/upload-artifact@v7
        with:
          name: release-demo-${{ github.sha }}
          path: build/demo
          if-no-files-found: error

  deploy-demo:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.tag.result == 'success' &&
      needs.demo.result == 'success'
    needs: [tag, demo]
    runs-on: ubuntu-latest
    concurrency:
      group: signalscope-demo-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The deployment job needs the checkout credential to push gh-pages.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-frontend: "false"
      - uses: actions/download-artifact@v8
        with:
          name: release-demo-${{ github.sha }}
          path: build/demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/demo/pages
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/demo.sh publish build/demo
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: [tag, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-${{ github.sha }}
          path: release-assets
      - env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: ./scripts/release.sh publish "$RELEASE_TAG" release-assets
