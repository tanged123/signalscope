name: SignalScope CI

on: push

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'pnpm install --frozen-lockfile && cargo fmt --all --check && pnpm lint'

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'pnpm install --frozen-lockfile && pnpm typecheck && pnpm codegen:check'

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'pnpm install --frozen-lockfile && cargo test --workspace && pnpm test'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'pnpm install --frozen-lockfile && pnpm e2e'

  builds:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'pnpm install --frozen-lockfile && pnpm build && cd shell/src-tauri && cargo tauri build'

  artifact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'pnpm install --frozen-lockfile && pnpm build && pnpm check:artifacts'
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-template
          path: frontend/dist/snapshot-template.html
