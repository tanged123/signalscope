name: SignalScope CI

on: push

permissions:
  contents: read

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/ci.sh flake

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/setup.sh
      - run: ./scripts/ci.sh lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/setup.sh
      - run: ./scripts/ci.sh typecheck

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/ci.sh clippy

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/setup.sh
      - run: ./scripts/ci.sh unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/setup.sh
      - run: ./scripts/ci.sh e2e

  builds:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/setup.sh
      - run: ./scripts/ci.sh build

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup-appimage.sh
      - run: ./scripts/ci.sh appimage
      - uses: actions/upload-artifact@v4
        with:
          name: signalscope-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  artifact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/setup.sh
      - run: ./scripts/ci.sh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-template
          path: frontend/dist/snapshot-template.html
